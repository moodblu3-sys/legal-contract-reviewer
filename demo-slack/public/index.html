<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>契約レビューBot デモ</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="workspace">Legal Ops Demo</div>
      <nav aria-label="channels">
        <div class="channel active"># contract-review</div>
        <div class="channel"># legal-intake</div>
        <div class="channel"># sales-support</div>
      </nav>
    </aside>

    <main class="app">
      <header class="topbar">
        <div>
          <h1># contract-review</h1>
          <p>Box上の契約書を、業務チャネルから自然文でレビュー依頼するデモ</p>
        </div>
        <div class="status">
          <span class="dot"></span>
          Box AI connected
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <article class="message user">
          <div class="avatar">田</div>
          <div class="bubble">
            <div class="meta">営業担当 <span>09:30</span></div>
            <p>Boxの sample_risky_contract.pdf を受託者の立場でレビューして</p>
          </div>
        </article>
        <article class="message bot">
          <div class="avatar bot-avatar">契</div>
          <div class="bubble">
            <div class="meta">契約レビューBot <span>09:30</span></div>
            <p>レビュー対象の契約書名またはBox URLを送ってください。立場は「受託者」「委託者」のどちらでも指定できます。</p>
          </div>
        </article>
      </section>

      <section class="composer" aria-label="message composer">
        <div class="quick-actions">
          <button data-prompt="Boxの sample_risky_contract.pdf を受託者の立場でレビューして">受託者側でレビュー</button>
          <button data-prompt="Boxの sample_risky_contract.pdf を委託者側でリスクレビューして">委託者側でレビュー</button>
        </div>
        <form id="review-form">
          <textarea id="message-input" rows="2">Boxの sample_risky_contract.pdf を受託者の立場でレビューして</textarea>
          <button id="send-button" type="submit">送信</button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
